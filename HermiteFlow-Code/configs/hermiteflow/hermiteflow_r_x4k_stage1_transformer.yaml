# HermiteFlow on X4K1000FPS, RAFT backbone, STAGE 1 - PURE-TRANSFORMER
# CoeffNet (feature/transformer-coeffnet, not on main).
#
# Identical to hermiteflow_r_x4k_stage1.yaml except arch.coeff_net_backbone
# below. Encoder AND decoder are window attention (Swin-style), not
# convolution - see phase2_coeffnet_transformer.py's module docstring for
# why (the 2K/4K eval-resolution constraint that rules out plain pixel
# self-attention, and why windows are shifted with a mask rather than
# left as isolated tiles). GlobalContext at the bottleneck is unchanged
# from the CNN branch and still applies via use_global_context.
#
# This is a SEPARATE experiment from the CNN run, not a replacement for
# it - point --result-path somewhere else so checkpoints do not collide:
#
#   python src/main.py -m configs/hermiteflow/hermiteflow_r_x4k_stage1_transformer.yaml \
#       --result-path /kaggle/working/runs_transformer \
#       --data-path /kaggle/input/datasets/mdrifaturrahman33/x4k1000fps/encoded_train \
#       --val-path  /kaggle/input/datasets/mdrifaturrahman33/x4k1000fps/val \
#       --raft-ckpt /kaggle/input/<weights>/raft-things.pth

trainer: stage_inr

dataset:
  # x4k_multi_t  runs the frozen teacher online, 2*K RAFT passes/step.
  # x4k_cached   reads them from scripts/generate_offline_gt.py instead,
  #              which removes ~900 ms of a ~1.19 s step. Flip the type
  #              and point cache_path at the output directory; everything
  #              else below still applies, including `repeat`, which the
  #              cached loader honours at read time (the cache holds one
  #              entry per clip, so without it an epoch would be 138
  #              steps instead of ~1.1k).
  type: x4k_multi_t
  cache_path: null
  # Training clips. Points at the mp4 tree; both this and the doubled
  # `encoded_train/encoded_train` resolve, the search is recursive.
  path: ./data/x4k/encoded_train
  # Validation frames, already decoded as PNG in the Kaggle mirror.
  val_path: ./data/x4k/val
  # "auto" picks mp4 when any are present, else png.
  source: auto

  # Temporal protocol, matching X-TEST as implemented in src/X4K.py:
  # endpoints 32 frames apart, middles on the t = k/8 grid.
  frame_gap: 32
  num_divisions: 8
  clip_length: 65

  # K supervised middle frames. Decoding cost is set by the last frame
  # needed, not by how many are kept, so raising K costs no extra I/O -
  # only the per-t compute of phases 3-5. Conditioning of the (A, B)
  # recovery on this grid, anchored at both extremes:
  #   K=2 31.5x   K=3 31.3x   K=5 26.5x   K=7 18.6x
  # 7 is the best-conditioned setting the dataset offers; drop to 5 or 3
  # if memory is tight, and lower experiment.batch_size with it.
  num_timesteps: 5
  crop_size: 256
  # Shrink each frame by this factor BEFORE cropping. X-TRAIN clips are
  # 768x768, so 3.0 gives exactly 256x256 with the whole field of view.
  #
  # Measured on X4K at frame_gap 32 (others/inspect_x4k_motion.py):
  #            |F|     out-of-crop   U/s     gate    curvature
  #   native   61.5px     4.4%      0.272    0.867     17.0 dB
  #   ds 3.0   22.1px     0.0%      0.012    0.991     17.1 dB
  #
  # Tracking improves 23x while the curvature signal - the thing the
  # model exists to learn - is untouched, because curvature is a ratio
  # of flow energies and so is scale-invariant. Cropping instead would
  # throw away 8/9 of the scene AND leave the motion untrackable.
  #
  # Note 3.0 makes the random crop a no-op (frame == crop_size). Use
  # 2.5 (768 -> 307) if you want crop jitter back as an augmentation.
  downsample: 3.0
  aug: true
  # X-TRAIN is only ~4.4k clips, but each yields many distinct samples
  # (random 32-frame window out of 65, random crop, random flips). One
  # pass over the clip list is ~137 optimizer steps at the settings
  # below, so a nominal 60 epochs would be only ~8k updates. Drawing
  # each clip 8x per epoch makes an epoch ~1.1k steps and 60 epochs
  # ~66k, which is a sane budget for three networks trained from
  # scratch. Raise `repeat` rather than `epochs` so checkpoint and
  # eval cadence stay reasonable.
  repeat: 8

arch:
  type: hermiteflow_r
  ema: true

  # Phase 1
  pretrained_raft_ckpt: pretrained/raft-things.pth
  raft_iter: 20
  min_flow_scale: 1.0

  # Phase 2 - endpoint velocities
  coeff_net_channels: 64
  gate_init_bias: 5.0
  gate_init_scale: 20.0
  use_rgb_branch: true
  # THE experiment this config exists for: encoder and decoder are
  # window attention, not the CNN U-Net. See
  # phase2_coeffnet_transformer.py.
  coeff_net_backbone: transformer
  # Window size in pixels of each stage's OWN resolution - cost stays
  # linear in image area at any window size, this just trades local
  # context per block against how many blocks are needed to cover it.
  transformer_window_size: 8
  # Global-attention block at the bottleneck (see GlobalContext in
  # phase2_coeffnet.py) - unchanged from the CNN branch, still worth
  # A/B'ing independently of the backbone swap above.
  use_global_context: false
  # Hard cap on |d_i|, in units of the motion scale s. The trajectory
  # loss constrains the symmetric mode d0 ~ d1 ~7.7x more weakly than
  # the antisymmetric one, and Adam takes full-size steps regardless of
  # gradient magnitude, so that direction can random-walk away without
  # the loss objecting (observed: |d0| = 1183 px at loss 0.026). The
  # oracle asks for ~0.375 s, so 2.0 is ~5x clear of any real solution
  # and never binds during healthy training. This fix is about the
  # (d0, d1) -> trajectory map, not about what predicts d0 and d1, so
  # it applies here exactly as much as it does to the CNN backbone.
  residual_bound: 2.0

  # Phase 3 - trajectory degree: linear | quadratic | cubic | quartic
  degree: cubic

  # Motion only: phases 4-5 are skipped and frozen, the objective is
  # trajectory distillation alone. GIMM's stage 1 is the same idea -
  # train the motion module by itself on a flow loss before the
  # synthesis module exists to absorb its errors.
  train_stage: 1

  # Phase 4
  refine_net_channels: 64
  refine_net_blocks: 3
  splat_impl: torch
  use_splat_importance: true

  # Phase 5
  synth_net_channels: 64

loss:
  # No image losses in stage 1 - nothing is rendered.
  perceptual_loss: False
  # Trajectory distillation against the frozen estimator run on the
  # ground-truth middle frames. Costs 2*K extra flow passes per step.
  flow_distill_weight: 1.0
  # The teacher runs 2*K frozen flow passes. Online that cost is paid
  # every step - at raft_iter=20 and K=5 it measured 901 ms against
  # 658 ms for the entire rest of the step, which is why this was 12.
  # Offline it is paid ONCE, so the speed argument no longer applies
  # and the only thing left to optimise is target quality. The
  # deviation the model has to learn is beta_2(t) * |(t-1) d0 + t d1|,
  # about 0.04 px at the d ~ 0.25 stage 1 currently reaches, so teacher
  # error is not a rounding detail - it is comparable to the signal.
  # Run the cache at 20 and never think about it again.
  teacher_raft_iter: 20

optimizer:
  type: adamw
  # GIMM's stage 1 uses a constant 1e-4 with no warmup and no weight
  # decay (paper Tab. 5). Same here - unproven for a transformer trunk
  # trained from scratch on this little data; watch the first epoch
  # rather than assuming it transfers.
  init_lr: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  warmup:
    epoch: 0
    multiplier: 1
    buffer_epoch: 0
    min_lr: 0.0001
    mode: fix
    start_from_zero: False
  max_gn: 1.0

experiment:
  amp: True
  # Per-sample cost grows with num_timesteps, since phases 3-5 run K
  # times. Not yet measured for this backbone - window attention's
  # activations are a different shape (tokens, not feature maps) than
  # the CNN's, so do not assume the CNN's GiB figures transfer. Watch
  # the first step and drop batch_size if it OOMs.
  batch_size: 32
  total_batch_size: 32
  num_workers: 4
  # Write scalars every N optimizer steps. Epoch-granularity logging is
  # blind here - an epoch is ~1-2k optimizer steps, i.e. hours.
  log_every: 50
  # Stage 1 is much cheaper per step (no synthesis forward/backward,
  # no Laplacian/census/LPIPS), so it can afford many more epochs.
  # GIMM trains its stage 1 for 240.
  epochs: 120
  # Kaggle sessions are capped (9-12 h) and a full run will not finish
  # in one. Checkpoint every epoch so a timeout costs at most one, and
  # chain sessions with --resume --load-path <ckpt>.
  save_ckpt_freq: 1
  test_freq: 5
  test_imlog_freq: 5
